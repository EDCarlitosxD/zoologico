<main id="main-dashboard">
  <app-sidebar></app-sidebar>

  <!--CONTENIDO DE -->
  <div class="dashboard-contenido">
      <section class="dashboard__titulo">
          <div class="dash_titleButton">
            <h3>{{dashboardTitulo}}</h3>
            <button [ngClass]="classButton" routerLink="create" class="chiquito">{{dashButton}}</button>
          </div>

          <div class="dashboard__perfil">
            <img src="img/navegacion/User.png" alt="Perfil">
            <div class="dashboard__perfil__datos">
              <p class="perfil__nombre bold">{{perfil.nombre}}</p>
              <p class="perfil__role p2 thin">{{rol}}</p>
            </div>

          </div>
      </section>
      <div class="line"></div>
      <h6 class="dashboard__descripcion">{{dashboardDescripcion}}</h6>
      <div class="dashboard-ng-content">
        <ng-content></ng-content>
      </div>
  </div>
</main>
